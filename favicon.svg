<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#3a0f1e"/>
      <stop offset="55%" stop-color="#170d11"/>
      <stop offset="100%" stop-color="#0a0708"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="url(#bgGlow)"/>

  <!-- robot head, cropped + scaled to fill the square -->
  <g transform="translate(16 16) scale(1.32) translate(-16 -8)">
    <!-- antenna -->
    <rect x="14" y="0" width="4" height="2" fill="#ffc2d9"/>
    <rect x="15" y="2" width="2" height="2" fill="#b8264f"/>

    <!-- head (staircase edges) -->
    <rect x="12" y="5" width="8" height="1" fill="#ff2f6d"/>
    <rect x="10" y="6" width="12" height="1" fill="#ff2f6d"/>
    <rect x="9"  y="7" width="14" height="6" fill="#ff2f6d"/>
    <rect x="10" y="13" width="12" height="1" fill="#ff2f6d"/>
    <rect x="12" y="14" width="8" height="1" fill="#ff2f6d"/>

    <!-- ears -->
    <rect x="7" y="8" width="2" height="4" fill="#b8264f"/>
    <rect x="23" y="8" width="2" height="4" fill="#b8264f"/>

    <!-- visor -->
    <rect x="11" y="8" width="10" height="4" fill="#22081a"/>
    <rect x="12.5" y="9" width="2.5" height="2.5" fill="#ffc2d9"/>
    <rect x="17" y="9" width="2.5" height="2.5" fill="#ffc2d9"/>
    <rect x="13" y="9" width="1" height="1" fill="#f3e9ec"/>
    <rect x="17.5" y="9" width="1" height="1" fill="#f3e9ec"/>

    <!-- neck -->
    <rect x="14" y="15" width="4" height="1" fill="#b8264f"/>
  </g>
</svg>
